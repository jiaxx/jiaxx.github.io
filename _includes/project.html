<article class="research-card">
  <a class="research-card__link" href="{{ project.url | relative_url }}" aria-label="Explore {{ project.title }}">
    <figure class="research-card__thumb">
      <img
        src="{{ '/assets/img/research/' | append: project.img | append: '_thumb@2x.jpg' | relative_url }}"
        alt="{{ project.title }} research direction"
        loading="lazy"
      >
    </figure>
    <div class="research-card__body">
      <p class="research-card__eyebrow">Research direction</p>
      <h2>{{ project.title }}</h2>
      <p>{{ project.subtitle }}</p>
      <span class="research-card__cta">Explore this direction <span aria-hidden="true">&rarr;</span></span>
    </div>
  </a>
</article>
